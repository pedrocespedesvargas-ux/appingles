            <button id="themeToggle" class="bg-slate-800 dark:bg-slate-800 p-2 rounded-xl text-amber-400 hover:bg-slate-700 transition shadow-inner">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>

            <button onclick="confirmResetProgress()" class="bg-rose-600/80 hover:bg-rose-600 text-white text-xs px-3 py-2 rounded-xl transition font-medium flex items-center space-x-1 shadow">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden md:inline" data-i18n="reset">Reset</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Mobile Sidebar Backdrop -->

        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 z-30 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-xl md:shadow-none">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h2 class="font-bold text-sm uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="studyPlan">Study Plan (24 Weeks)</h2>
                <button id="sidebarClose" class="md:hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="navAccordion" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">

                <span id="streakCount">🔥 <span data-i18n="streak">Streak</span>: 0 <span data-i18n="days">days</span></span>

        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-100 dark:bg-slate-900/50">
            <div id="lessonContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 max-w-5xl mx-auto w-full">

                                <i class="fa-solid fa-book-open text-turquoise mr-2"></i> ${dict.readingConcept}
                            </h3>
                            <p class="text-sm leading-relaxed text-slate-600 dark:text-slate-300 mb-4">${lesson.materials.readingText}</p>
                            
                            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-400 mb-3">${dict.todayVocab}</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                                ${lesson.materials.vocabulary.map(v => `
                                    <div class="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200 dark:border-slate-600 flex justify-between items-center">
                                        <div>
                                            <span class="font-bold text-sm text-navy dark:text-white">${v.term}</span>
                                            <p class="text-xs text-slate-500 dark:text-slate-400">${v.translation}</p>
                                        </div>
                                        <button onclick="speakText('${v.term}')" class="text-turquoise hover:text-turquoise-hover p-1">
                                            <i class="fa-solid fa-volume-high"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <!-- Lesson Header -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="px-3 py-1 bg-turquoise/10 text-turquoise rounded-full text-xs font-bold uppercase tracking-wider">
                            ${dict.month} ${monthNum} • ${dict.week} ${weekNum} • ${dict.day} ${dayNum}
                        </span>
                        <span class="text-xs font-semibold text-slate-400">${MONTH_THEMES[lang][monthNum].title}</span>
                    </div>
                    <h2 class="text-2xl font-bold text-navy dark:text-white mb-2">${lesson.title}</h2>
                    <p class="text-sm font-medium text-slate-600 dark:text-slate-300"><strong class="text-turquoise">${dict.objective}:</strong> ${lesson.objective}</p>
                </div>

                <!-- Material Section -->
                <div class="mb-6">
                    ${materialHTML}
                </div>

                <!-- Interactive Practice Area -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
                    <h3 class="font-bold text-lg text-navy dark:text-white mb-2 flex items-center">
                        <i class="fa-solid fa-pen-to-square text-turquoise mr-2"></i> ${dict.practiceArea}
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">${dict.practiceAreaDesc}</p>
                    
                    <textarea 
                        id="userAnswerInput" 
                        oninput="saveUserAnswer(${dayNum}, this.value)"
                        rows="4" 
                        class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-turquoise transition"
                        placeholder="${dict.placeholderPractice}">${userAnswer}</textarea>
                </div>

                <!-- Notes Area -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
                    <h3 class="font-bold text-lg text-navy dark:text-white mb-2 flex items-center">
                        <i class="fa-solid fa-note-sticky text-turquoise mr-2"></i> ${dict.personalNotes}
                    </h3>
                    <textarea 
                        id="userNoteInput" 
                        oninput="saveUserNote(${dayNum}, this.value)"
                        rows="3" 
                        class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-turquoise transition"
                        placeholder="${dict.placeholderNotes}">${userNote}</textarea>
                </div>

                <!-- Footer Navigation & Completion Toggle -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <button onclick="navigateDay(-1)" ${dayNum === 1 ? 'disabled' : ''} class="w-full sm:w-auto px-5 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 disabled:opacity-50 rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>${dict.prevDay}</span>
                    </button>

                    <button onclick="toggleDayCompleted(${dayNum})" id="completeBtn" class="w-full sm:w-auto px-6 py-3 rounded-xl text-sm font-bold transition shadow flex items-center justify-center space-x-2 ${
                        isCompleted 
                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white' 
                            : 'bg-turquoise hover:bg-turquoise-hover text-white'
                    }">
                        <i class="fa-solid ${isCompleted ? 'fa-check-double' : 'fa-check'}"></i>
                        <span>${isCompleted ? dict.dayCompleted : dict.markCompleted}</span>
                    </button>

                    <button onclick="navigateDay(1)" ${dayNum === 168 ? 'disabled' : ''} class="w-full sm:w-auto px-5 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 disabled:opacity-50 rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-2">
                        <span>${dict.nextDay}</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
            container.scrollTop = 0;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function flipCard(idx) {
            const card = document.getElementById(`card-${idx}`);
            card.classList.toggle('rotate-y-180');
        }

        function saveUserAnswer(dayNum, text) {
            state.userAnswers[dayNum] = text;
            saveState();
        }

        function saveUserNote(dayNum, text) {
            state.userNotes[dayNum] = text;
            saveState();
        }

        function toggleDayCompleted(dayNum) {
            const index = state.completedDays.indexOf(dayNum);
            if (index > -1) {
                state.completedDays.splice(index, 1);
            } else {
                state.completedDays.push(dayNum);
            }
            saveState();
            renderSidebar();
            renderLesson(dayNum);
            updateOverallProgress();
        }

        function navigateDay(direction) {
            const nextDay = state.currentDay + direction;
            if (nextDay >= 1 && nextDay <= 168) {
                state.currentDay = nextDay;
                renderSidebar();
                renderLesson(nextDay);
            }
        }

        function startVoiceRecognition() {
            const dict = i18n[state.lang];
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Voice recognition is not supported in this browser. Please use Chrome.');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            
            const btn = document.getElementById('micBtn');
            const resultDiv = document.getElementById('micResult');
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Listening...`;
            btn.classList.add('bg-amber-600');
            resultDiv.classList.remove('hidden');
            resultDiv.innerText = dict.listening;

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                resultDiv.innerText = `You said: "${speechToText}" Great job!`;
                btn.innerHTML = `<i class="fa-solid fa-microphone"></i> ${dict.startMic}`;
                btn.classList.remove('bg-amber-600');
            };

            recognition.onerror = () => {
                resultDiv.innerText = "Audio capture failed. Please try again.";
                btn.innerHTML = `<i class="fa-solid fa-microphone"></i> ${dict.startMic}`;
                btn.classList.remove('bg-amber-600');
            };

            recognition.onend = () => {
                btn.innerHTML = `<i class="fa-solid fa-microphone"></i> ${dict.startMic}`;
                btn.classList.remove('bg-amber-600');
            };

            recognition.start();
        }

        let timerInterval = null;
        function startTimer(duration) {
            clearInterval(timerInterval);
            let timer = duration;
            const display = document.getElementById('timerDisplay');
            const btn = document.getElementById('timerBtn');
            display.classList.remove('hidden');
            btn.disabled = true;

            timerInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    display.innerText = i18n[state.lang].timerFinished;
                    btn.disabled = false;
                }
            }, 1000);
        }

        // --- RESET MODAL HANDLERS ---
        function confirmResetProgress() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        function executeResetProgress() {
            localStorage.clear();
            state.completedDays = [];
            state.userNotes = {};
            state.userAnswers = {};
            state.currentDay = 1;
            closeModal();
            renderSidebar();
            renderLesson(1);
            updateOverallProgress();
        }
    </script>
</body>
</html>
